<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >

    <meta name="theme-color" content="#020604">

    <title>WIW GAMES</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="topbar">

        <div class="brand">
            <div class="brand-main">
                WIW
            </div>

            <div class="brand-sub">
                GAMES
            </div>
        </div>

        <div class="balance-box">

            <div class="balance-star">
                ★
            </div>

            <span id="balance">
                1000
            </span>

        </div>

    </header>


    <!-- ================= HOME ================= -->

    <main id="homePage" class="page active">

        <section class="games-section">

            <div class="section-head">

                <div>
                    <div class="section-title">
                        Игры
                    </div>

                    <div class="section-line"></div>
                </div>

                <div class="games-count">
                    3 игры
                </div>

            </div>


            <div class="games-grid">


                <!-- ROCKET -->

                <button
                    class="game-card rocket-card"
                    onclick="openGame('rocketPage')"
                >

                    <div class="card-glow"></div>

                    <div class="game-image-wrap">

                        <img
                            src="assets/rocket.png"
                            class="game-image rocket-image"
                            alt="Rocket"
                        >

                    </div>

                    <div class="game-info">

                        <div class="game-name">
                            ROCKET
                        </div>

                        <div class="game-description">
                            Забери выигрыш вовремя
                        </div>

                        <div class="play-arrow">
                            →
                        </div>

                    </div>

                </button>



                <!-- MINES -->

                <button
                    class="game-card mines-card"
                    onclick="openGame('minesPage')"
                >

                    <div class="card-glow"></div>

                    <div class="game-image-wrap">

                        <img
                            src="assets/mines.png"
                            class="game-image mines-image"
                            alt="Mines"
                        >

                    </div>

                    <div class="game-info">

                        <div class="game-name">
                            MINES
                        </div>

                        <div class="game-description">
                            Найди безопасные клетки
                        </div>

                        <div class="play-arrow">
                            →
                        </div>

                    </div>

                </button>



                <!-- PLINKO -->

                <button
                    class="game-card plinko-card"
                    onclick="openGame('plinkoPage')"
                >

                    <div class="card-glow"></div>

                    <div class="game-image-wrap">

                        <img
                            src="assets/plinko.png"
                            class="game-image plinko-image"
                            alt="Plinko"
                        >

                        <div class="plinko-ball"></div>

                    </div>

                    <div class="game-info">

                        <div class="game-name">
                            PLINKO
                        </div>

                        <div class="game-description">
                            Запусти шарик
                        </div>

                        <div class="play-arrow">
                            →
                        </div>

                    </div>

                </button>

            </div>

        </section>

    </main>



    <!-- ================= LEADERBOARD ================= -->

    <main id="leaderboardPage" class="page">

        <section class="inner-page">

            <div class="inner-title">
                Лидерборд
            </div>

            <div class="inner-subtitle">
                Лучшие игроки
            </div>


            <div class="leader-list">

                <div class="leader-item first">

                    <div class="leader-place">
                        1
                    </div>

                    <div class="leader-avatar">
                        W
                    </div>

                    <div class="leader-user">
                        <b>WIW Player</b>
                        <span>Лучший игрок</span>
                    </div>

                    <div class="leader-score">
                        12 450
                    </div>

                </div>


                <div class="leader-item">

                    <div class="leader-place">
                        2
                    </div>

                    <div class="leader-avatar">
                        G
                    </div>

                    <div class="leader-user">
                        <b>GreenFox</b>
                        <span>Игрок</span>
                    </div>

                    <div class="leader-score">
                        9 820
                    </div>

                </div>


                <div class="leader-item">

                    <div class="leader-place">
                        3
                    </div>

                    <div class="leader-avatar">
                        X
                    </div>

                    <div class="leader-user">
                        <b>NeonX</b>
                        <span>Игрок</span>
                    </div>

                    <div class="leader-score">
                        7 640
                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- ================= PROFILE ================= -->

    <main id="profilePage" class="page">

        <section class="inner-page">

            <div class="profile-card">

                <div
                    class="profile-avatar"
                    id="profileAvatar"
                >
                    W
                </div>

                <div class="profile-name" id="profileName">
                    Игрок
                </div>

                <div class="profile-id" id="profileId">
                    ID: —
                </div>

            </div>


            <div class="stats-grid">

                <div class="stat-box">

                    <span>
                        Баланс
                    </span>

                    <strong id="profileBalance">
                        1000
                    </strong>

                </div>

                <div class="stat-box">

                    <span>
                        Тапы
                    </span>

                    <strong id="tapCount">
                        0
                    </strong>

                </div>

            </div>


            <button
                class="tap-button"
                onclick="tap()"
            >

                <span class="tap-circle">
                    TAP
                </span>

                <span class="tap-text">
                    Получить +100
                </span>

            </button>

        </section>

    </main>



    <!-- ================= TAP ================= -->

    <main id="tapPage" class="page">

        <section class="inner-page tap-page">

            <div class="inner-title">
                Тапалка
            </div>

            <div class="inner-subtitle">
                Нажимай и получай очки
            </div>


            <button
                class="big-tap"
                onclick="tap()"
            >

                <span>
                    TAP
                </span>

            </button>


            <div class="tap-balance">

                <span>
                    Текущий баланс
                </span>

                <strong id="tapPageBalance">
                    1000
                </strong>

            </div>

        </section>

    </main>



    <!-- ================= ROCKET ================= -->

    <main id="rocketPage" class="page game-page">

        <button
            class="back-button"
            onclick="goHome()"
        >
            ← Назад
        </button>

        <div class="game-screen-title">
            ROCKET
        </div>

        <div class="game-placeholder">
            <img
                src="assets/rocket.png"
                alt="Rocket"
            >
        </div>

    </main>



    <!-- ================= MINES ================= -->

    <main id="minesPage" class="page game-page">

        <button
            class="back-button"
            onclick="goHome()"
        >
            ← Назад
        </button>

        <div class="game-screen-title">
            MINES
        </div>

        <div class="game-placeholder">
            <img
                src="assets/mines.png"
                alt="Mines"
            >
        </div>

    </main>



    <!-- ================= PLINKO ================= -->

    <main id="plinkoPage" class="page game-page">

        <button
            class="back-button"
            onclick="goHome()"
        >
            ← Назад
        </button>

        <div class="game-screen-title">
            PLINKO
        </div>

        <div class="game-placeholder">
            <img
                src="assets/plinko.png"
                alt="Plinko"
            >
        </div>

    </main>



    <!-- ================= BOTTOM NAV ================= -->

    <nav class="bottom-nav">

        <button
            class="nav-item active"
            data-page="homePage"
            onclick="openPage('homePage')"
        >

            <span class="nav-icon home-icon"></span>

            <span>
                Игры
            </span>

        </button>


        <button
            class="nav-item"
            data-page="leaderboardPage"
            onclick="openPage('leaderboardPage')"
        >

            <span class="nav-icon trophy-icon"></span>

            <span>
                Топ
            </span>

        </button>


        <button
            class="nav-item"
            data-page="profilePage"
            onclick="openPage('profilePage')"
        >

            <span class="nav-icon profile-icon"></span>

            <span>
                Профиль
            </span>

        </button>


        <button
            class="nav-item"
            data-page="tapPage"
            onclick="openPage('tapPage')"
        >

            <span class="nav-icon tap-icon"></span>

            <span>
                Тапалка
            </span>

        </button>

    </nav>

</div>


<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script src="game.js"></script>

</body>
</html>
